# Garbage collection treats every store path a process on the host has open
# or mapped as a runtime root, and builds in diverted stores see their store
# at the same `/nix/store` paths. A test that lists roots or collects garbage
# while another one builds with the shared busybox therefore sees extra
# `/proc/PID/...` roots, so these tests run with no other test alongside.
[[profile.default.overrides]]
filter = """
binary(reference_gc)
| binary(reference_collect_garbage)
| test(garbage_collection_through_the_daemon_matches_the_reference)
| test(indirect_roots_through_the_daemon_match_the_reference)
| test(every_protocol_version_matches_the_reference)
| test(untrusted_clients_get_the_reference_warnings_and_censored_roots)
| test(garbage_collection_works_through_both_daemons)
| test(store_maintenance_and_ping_alias)
| test(realises_with_roots_and_queries_like_cppnix)
"""
threads-required = "num-test-threads"

# Harness tiers (docs/compatibility-results.md). `just test-fast`,
# `test-store` and `test-daemon` run these profiles through
# `scripts/compat-results.py run`, which turns each profile's JUnit report
# into result records. The tiers partition the workspace except the
# toolchain-sensitive `nix-compat-derive-tests` UI snapshots, which only
# `just test` runs. The default profile's overrides above apply to every
# profile.
#
# fast: format and fixture checks that need no reference executable, no
# store on disk and no daemon.
[profile.fast]
default-filter = """
package(noxi-compat) | package(noxi-hash) | package(noxi-flakeref)
| package(noxi-serde) | package(noxi-compat-derive) | package(noxi-events)
| (package(noxi-compat-tests) & (
kind(lib)
| (binary(/^upstream_/) - binary(upstream_functional) - binary(upstream_lang) - binary(upstream_filetransfer_retry))
| binary(fixture_inventory) | binary(differential_eval) | binary(derivation_parser_extensions)
| binary(reference_derivation_aterm) | binary(reference_nars)
))
"""
junit.path = "junit.xml"

# daemon: daemon executables, worker-protocol exchanges and client/daemon
# pairings against the reference.
[profile.daemon]
default-filter = """
(package(noxi-daemon) | binary(reference_daemon) | binary(reference_worker_wire)
| binary(reference_daemon_client) | test(/daemon/))
- package(noxi-compat) - package(noxi-hash) - package(noxi-flakeref) - package(noxi-serde)
- package(noxi-compat-derive) - package(noxi-events) - package(nix-compat-derive-tests)
- (package(noxi-compat-tests) & (kind(lib)
| (binary(/^upstream_/) - binary(upstream_functional) - binary(upstream_lang) - binary(upstream_filetransfer_retry))
| binary(fixture_inventory) | binary(differential_eval) | binary(derivation_parser_extensions)
| binary(reference_derivation_aterm) | binary(reference_nars)))
"""
junit.path = "junit.xml"

# store: everything else; reference-executable comparisons in isolated
# diverted stores, builds, caches and evaluation through the commands.
[profile.store]
default-filter = """
all()
- package(noxi-compat) - package(noxi-hash) - package(noxi-flakeref) - package(noxi-serde)
- package(noxi-compat-derive) - package(noxi-events) - package(nix-compat-derive-tests)
- (package(noxi-compat-tests) & (kind(lib)
| (binary(/^upstream_/) - binary(upstream_functional) - binary(upstream_lang) - binary(upstream_filetransfer_retry))
| binary(fixture_inventory) | binary(differential_eval) | binary(derivation_parser_extensions)
| binary(reference_derivation_aterm) | binary(reference_nars)))
- package(noxi-daemon) - binary(reference_daemon) - binary(reference_worker_wire)
- binary(reference_daemon_client) - test(/daemon/)
"""
junit.path = "junit.xml"
