# Maps each row of docs/compatibility-matrix.md to the tests that are its
# evidence. Keys are row ids: the row's Area, lower-cased, with every run of
# other characters replaced by `-`. `scripts/compat-results.py evidence --check`
# fails when a matrix row is missing here or a key names no matrix row.
#
# Entries name nextest binary ids: `PACKAGE` for a package's unit tests,
# `PACKAGE::BINARY` for an integration test binary, or `BINARY_ID REGEX` to
# claim only the tests whose names match REGEX. The most specific entry wins:
# a test-name entry, then a binary, then a package. Differential runners name
# their row in each record themselves. An empty list means no automated test
# is evidence for the row yet.

[rows]
nix-language-and-evaluator = [
	"noxi-eval",
	"noxi-compat-tests::upstream_lang",
	"noxi-compat-tests::differential_eval",
	"noxi-commands::language_boundaries",
	"noxi-commands::generated_boundaries",
	"noxi-commands::generated_forcing",
	"noxi-commands::generated_identity",
	"noxi-commands::generated_regex_data",
	"noxi-commands::generated_restricted",
	"noxi-commands::generated_ca",
	"noxi-commands::generated_derivation_import",
	"noxi-cli",
	"noxi-cli::cli",
]
hash-algorithms = [
	"noxi-hash",
	"noxi-compat-tests::upstream_hashes",
	"noxi-compat-tests::reference_hash_formats",
	"noxi-compat-tests::reference_hash_modulo",
]
fetcher-cache-formats = [
	"noxi-glue::fetch_cache",
]
flakes-and-fetchers = [
