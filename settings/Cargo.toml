[workspace]
resolver = "2"
members = [
	"crates/noxios-settings-gui",
	"crates/noxios-settings-cli",
	"crates/noxios-settings-cmd",
	"crates/noxios-settings-tui",
	"crates/noxios-settings-core",
	"crates/noxios-settings-engine",
	"crates/noxios-settings-config",
]
# The desktop front-end pulls in GPUI and the graphics stack,
# so a plain `cargo build`/`cargo test` leaves it out. Build it with
# `-p noxios-settings-gui --features native`.
default-members = [
	"crates/noxios-settings-cli",
	"crates/noxios-settings-cmd",
	"crates/noxios-settings-tui",
	"crates/noxios-settings-core",
	"crates/noxios-settings-engine",
	"crates/noxios-settings-config",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-input = "0.15.5"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
directories = "5.0"
futures = "0.3"
libc = "0.2"

# Keep file/line backtraces without generating full variable debug information.
[profile.dev]
debug = "line-tables-only"

# Opt in with `cargo build --profile debugging` for full debugger support.
[profile.debugging]
inherits = "dev"
debug = 2
