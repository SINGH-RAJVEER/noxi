[package]
name = "noxi-store"
version = "0.0.2"
rust-version.workspace = true
edition = "2024"
description = "A local Nix store compatible with CppNix's on-disk format"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"
publish = ["crates-io"]

[dependencies]
aho-corasick.workspace = true
brotli-decompressor = "5.0"
bzip2 = "0.6"
data-encoding.workspace = true
ed25519.workspace = true
flate2 = "1.1"
ureq = "3"
libc.workspace = true
memchr = "2.8"
lzma-rust2 = { version = "0.15", default-features = false, features = ["std", "xz"] }
nix-compat = { package = "noxi-compat", path = "../noxi/nix-compat", version = "0.0.2", features = ["serde"] }
path-clean.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
zstd.workspace = true
