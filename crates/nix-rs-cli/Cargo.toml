[package]
name = "nix-rs-cli"
version = "0.1.1"
rust-version.workspace = true
edition = "2024"
description = "Preview command-line entry point for the nix-rs package manager"
license = "Apache-2.0"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"

[[bin]]
name = "nixrs"
path = "src/main.rs"

[dependencies]
mimalloc.workspace = true
nix-rs-eval = { path = "../nix-rs/eval", version = "0.2.0", default-features = false }

[dev-dependencies]
tempfile.workspace = true
