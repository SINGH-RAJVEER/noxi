[package]
name = "nix-rs-build"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Derivation builds for the nix-rs engine, compatible with CppNix's sandbox"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"
publish = false

[dependencies]
bstr.workspace = true
libc.workspace = true
nix-compat = { package = "nix-rs-compat", path = "../nix-rs/nix-compat", version = "0.1.0", features = ["serde"] }
nix-rs-store = { path = "../nix-rs-store" }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
