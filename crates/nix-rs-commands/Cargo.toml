[package]
name = "nix-rs-commands"
version = "0.1.2"
rust-version.workspace = true
edition = "2024"
description = "CppNix-compatible command implementations for nix-rs"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"

# Named like the CppNix commands they replace, so they are not installed by
# the preview flake package and never shadow a system Nix.
[[bin]]
name = "nix"
path = "src/bin/nix.rs"

[[bin]]
name = "nix-shell"
path = "src/bin/nix-shell.rs"

[[bin]]
name = "nix-copy-closure"
path = "src/bin/nix-copy-closure.rs"

[[bin]]
name = "nix-instantiate"
path = "src/bin/nix-instantiate.rs"

[[bin]]
name = "nix-build"
path = "src/bin/nix-build.rs"

[[bin]]
name = "nix-store"
path = "src/bin/nix-store.rs"

[[bin]]
name = "nix-collect-garbage"
path = "src/bin/nix-collect-garbage.rs"

[[bin]]
name = "nix-env"
path = "src/bin/nix-env.rs"

[dependencies]
bytes.workspace = true
nix-compat = { package = "nix-rs-compat", path = "../nix-rs/nix-compat", version = "0.1.2" }
nix-rs-eval = { path = "../nix-rs/eval", version = "0.2.2", default-features = false, features = ["impure"] }
nix-rs-build = { path = "../nix-rs-build", version = "0.1.0" }
nix-rs-daemon = { path = "../nix-rs-daemon", version = "0.1.0" }
nix-rs-glue = { path = "../nix-rs-glue", version = "0.1.2" }
nix-rs-store = { path = "../nix-rs-store", version = "0.1.0" }
regex.workspace = true
libc.workspace = true
rustc-hash.workspace = true
smol_str.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
