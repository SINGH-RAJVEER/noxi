[package]
name = "nix-rs-commands"
version = "0.1.2"
rust-version.workspace = true
edition = "2024"
description = "CppNix-compatible command implementations for nix-rs"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"

# Named like the CppNix commands they replace, so they are not installed by
# the preview flake package and never shadow a system Nix.
[[bin]]
name = "nix-instantiate"
path = "src/bin/nix-instantiate.rs"

[dependencies]
nix-compat = { package = "nix-rs-compat", path = "../nix-rs/nix-compat", version = "0.1.1" }
nix-rs-eval = { path = "../nix-rs/eval", version = "0.2.2", default-features = false, features = ["impure"] }
nix-rs-glue = { path = "../nix-rs-glue", version = "0.1.2" }
rustc-hash.workspace = true
smol_str.workspace = true

[dev-dependencies]
tempfile.workspace = true
