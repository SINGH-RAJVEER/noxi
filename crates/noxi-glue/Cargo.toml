[package]
name = "noxi-glue"
version = "0.0.2"
rust-version.workspace = true
edition = "2024"
description = "Store-aware builtins for the noxi evaluator, derived from Snix's glue crates"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"

[dependencies]
bstr.workspace = true
bytes.workspace = true
data-encoding.workspace = true
nix-compat = { package = "noxi-compat", path = "../noxi/nix-compat", version = "0.0.3" }
noxi-eval = { path = "../noxi/eval", version = "0.0.3", default-features = false, features = ["impure"] }
noxi-store = { path = "../noxi-store", version = "0.0.3" }
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
noxi-flakeref = { path = "../noxi-flakeref", version = "0.0.3" }
tar = "0.4"
flate2 = "1.1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.15", default-features = false, features = ["std", "xz"] }
zstd.workspace = true
ureq = "3"
