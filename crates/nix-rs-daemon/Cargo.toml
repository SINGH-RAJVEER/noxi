[package]
name = "nix-rs-daemon"
version = "0.1.0"
rust-version.workspace = true
edition = "2024"
description = "A Nix daemon for the nix-rs engine, speaking CppNix's worker protocol"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"
publish = false

[dependencies]
libc.workspace = true
nix-compat = { package = "nix-rs-compat", path = "../nix-rs/nix-compat", version = "0.1.1" }
nix-rs-build = { path = "../nix-rs-build", version = "0.1.0" }
nix-rs-store = { path = "../nix-rs-store", version = "0.1.0" }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
