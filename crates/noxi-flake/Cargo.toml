[package]
name = "noxi-flake"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Flake graph and operation library for noxi"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"

[dependencies]
bstr.workspace = true
nix-compat = { package = "noxi-compat", path = "../noxi/nix-compat", version = "0.0.1" }
noxi-eval = { path = "../noxi/eval", version = "0.0.1", default-features = false, features = ["impure"] }
noxi-flakeref = { path = "../noxi-flakeref", version = "0.0.1" }
noxi-glue = { path = "../noxi-glue", version = "0.0.1" }
noxi-store = { path = "../noxi-store", version = "0.0.1" }
serde_json.workspace = true
sha2.workspace = true
data-encoding.workspace = true

[dev-dependencies]
tempfile.workspace = true
noxi-build = { path = "../noxi-build", version = "0.0.1" }
