[package]
name = "nixrs-compat-tests"
version.workspace = true
rust-version.workspace = true
edition = "2024"
publish = false
description = "Differential tests that check vendored and first-party crates against the upstream CppNix fixtures in tests/nix"

[dependencies]
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[dev-dependencies]
nix-rs-eval = { path = "../nix-rs/eval", default-features = false, features = ["impure"] }
nix-rs-commands = { path = "../nix-rs-commands" }
nix-compat = { package = "nix-rs-compat", path = "../nix-rs/nix-compat", features = ["serde", "daemon"] }
nix-rs-store = { path = "../nix-rs-store" }
nix-rs-build = { path = "../nix-rs-build" }
nix-rs-daemon = { path = "../nix-rs-daemon" }
bstr.workspace = true
data-encoding.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "upstream_lang"
harness = false
