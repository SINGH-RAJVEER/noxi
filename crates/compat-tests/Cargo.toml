[package]
name = "noxi-compat-tests"
version.workspace = true
rust-version.workspace = true
edition = "2024"
publish = false
description = "Differential tests that check vendored and first-party crates against the upstream CppNix fixtures in tests/nix"

[dependencies]
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[dev-dependencies]
libc.workspace = true
noxi-eval = { path = "../noxi/eval", default-features = false, features = ["impure"] }
noxi-commands = { path = "../noxi-commands" }
nix-compat = { package = "noxi-compat", path = "../noxi/nix-compat", features = ["serde", "daemon"] }
noxi-store = { path = "../noxi-store" }
noxi-build = { path = "../noxi-build" }
noxi-daemon = { path = "../noxi-daemon" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
bstr.workspace = true
data-encoding.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "upstream_lang"
harness = false
