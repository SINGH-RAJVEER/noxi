[package]
name = "noxi-commands"
version = "0.0.5"
rust-version.workspace = true
edition = "2024"
description = "CppNix-compatible command implementations for noxi"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"

# Named like the CppNix commands they replace, so they are not installed by
# the preview flake package and never shadow a system Nix.
[[bin]]
name = "nix"
path = "src/bin/nix.rs"

[[bin]]
name = "nix-hash"
path = "src/bin/nix-hash.rs"

[[bin]]
name = "nix-shell"
path = "src/bin/nix-shell.rs"

[[bin]]
name = "nix-copy-closure"
path = "src/bin/nix-copy-closure.rs"

[[bin]]
name = "nix-instantiate"
path = "src/bin/nix-instantiate.rs"

[[bin]]
name = "nix-build"
path = "src/bin/nix-build.rs"

[[bin]]
name = "nix-store"
path = "src/bin/nix-store.rs"

[[bin]]
name = "nix-collect-garbage"
path = "src/bin/nix-collect-garbage.rs"

[[bin]]
name = "nix-env"
path = "src/bin/nix-env.rs"

[features]
eval-allocation-diagnostics = []

[dependencies]
bytes.workspace = true
bstr.workspace = true
# `no_thp` stops mimalloc from madvising its arenas MADV_HUGEPAGE. On hosts whose
# THP defrag mode is `madvise`, every first touch of a 2 MiB region then stalls in
# direct compaction, which fails on fragmented memory and still faults 4 KiB pages.
mimalloc = { workspace = true, features = ["no_thp"] }
nix-compat = { package = "noxi-compat", path = "../noxi/nix-compat", version = "0.0.5" }
noxi-eval = { path = "../noxi/eval", version = "0.0.5", default-features = false, features = ["impure"] }
noxi-build = { path = "../noxi-build", version = "0.0.4" }
noxi-daemon = { path = "../noxi-daemon", version = "0.0.5" }
noxi-flakeref = { path = "../noxi-flakeref", version = "0.0.3" }
noxi-flake = { path = "../noxi-flake", version = "0.0.4" }
noxi-glue = { path = "../noxi-glue", version = "0.0.4" }
noxi-store = { path = "../noxi-store", version = "0.0.5" }
regex.workspace = true
rnix.workspace = true
url.workspace = true
libc.workspace = true
rustc-hash.workspace = true
smol_str.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[dev-dependencies]
noxi-test-support = { path = "../noxi-test-support" }
tempfile.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
lzma-rust2 = { version = "0.15", default-features = false, features = ["std", "xz", "encoder"] }
