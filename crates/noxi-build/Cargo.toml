[package]
name = "noxi-build"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Derivation builds for the noxi engine, compatible with CppNix's sandbox"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"
publish = ["crates-io"]

[dependencies]
bstr.workspace = true
bzip2 = "0.6"
libc.workspace = true
nix-compat = { package = "noxi-compat", path = "../noxi/nix-compat", version = "0.0.1", features = ["serde"] }
noxi-store = { path = "../noxi-store", version = "0.0.1" }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
