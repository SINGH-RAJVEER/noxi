[package]
name = "nix-rs-glue"
version = "0.1.2"
rust-version.workspace = true
edition = "2024"
description = "Store-aware builtins for the nix-rs evaluator, derived from Snix's glue crates"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"

[dependencies]
bstr.workspace = true
bytes.workspace = true
data-encoding.workspace = true
nix-compat = { package = "nix-rs-compat", path = "../nix-rs/nix-compat", version = "0.1.0" }
nix-rs-eval = { path = "../nix-rs/eval", version = "0.2.2", default-features = false, features = ["impure"] }
nix-rs-store = { path = "../nix-rs-store", version = "0.1.0" }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
nix-rs-flakeref = { path = "../nix-rs-flakeref", version = "0.1.0" }
tar = "0.4"
flate2 = "1.1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.15", default-features = false, features = ["std", "xz"] }
zstd.workspace = true
ureq = "3"
