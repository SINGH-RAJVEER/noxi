[package]
name = "nix-rs-glue"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Store-aware builtins for the nix-rs evaluator, derived from Snix's glue crates"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"
publish = false

[dependencies]
bstr.workspace = true
bytes.workspace = true
data-encoding.workspace = true
nix-compat = { path = "../nix-rs/nix-compat" }
nix-rs-eval = { path = "../nix-rs/eval", default-features = false, features = ["impure"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
