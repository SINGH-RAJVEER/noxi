[package]
name = "nix-rs-flake"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Flake graph and operation library for nix-rs"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"

[dependencies]
bstr.workspace = true
nix-compat = { package = "nix-rs-compat", path = "../nix-rs/nix-compat", version = "0.1.0" }
nix-rs-eval = { path = "../nix-rs/eval", version = "0.2.2", default-features = false, features = ["impure"] }
nix-rs-flakeref = { path = "../nix-rs-flakeref", version = "0.1.0" }
nix-rs-glue = { path = "../nix-rs-glue", version = "0.1.2" }
nix-rs-store = { path = "../nix-rs-store", version = "0.1.0" }
serde_json.workspace = true
sha2.workspace = true
data-encoding.workspace = true

[dev-dependencies]
tempfile.workspace = true
nix-rs-build = { path = "../nix-rs-build", version = "0.1.0" }
