[package]
name = "noxi-eval-builtin-macros"
version = "0.0.1"
authors = ["Griffin Smith <root@gws.fyi>"]
edition = "2024"
rust-version.workspace = true
description = "Procedural macros for defining noxi-eval builtins, derived from snix-eval-builtin-macros"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"

[dependencies]
syn = { version = "1.0.109", features = [
	"full",
	"parsing",
	"printing",
	"visit",
	"visit-mut",
	"extra-traits",
] }
quote.workspace = true
proc-macro2.workspace = true

[lib]
proc-macro = true

[dev-dependencies]
noxi-eval = { path = "../" }
