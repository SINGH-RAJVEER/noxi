[package]
name = "noxi-serde"
version = "0.0.1"
edition = "2024"
rust-version.workspace = true
description = "Serialize and deserialize Nix values with serde, derived from Snix serde"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"

[dependencies]
noxi-eval = { path = "../eval", version = "0.0.1" }
serde = { workspace = true, features = ["derive"] }
bstr = { workspace = true, features = ["serde"] }
