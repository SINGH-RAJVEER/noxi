[package]
name = "noxi-events"
version = "0.0.1"
rust-version.workspace = true
edition = "2024"
description = "Structured operation events, per-build output streams and rustc-style terminal rendering for noxi"
license = "GPL-3.0-only"
repository = "https://github.com/SINGH-RAJVEER/nix-rs"

[dependencies]
annotate-snippets.workspace = true
anstyle.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
expect-test.workspace = true
